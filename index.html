<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06080c" />
    <script>
      // Apply the saved theme before first paint. Dark is the default.
      (function () {
        var theme = "dark";
        try {
          if (localStorage.getItem("theme") === "light") theme = "light";
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
        if (theme === "light") {
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f4f6f9");
        }
      })();
    </script>
    <meta
      name="description"
      content="Alejandro Lopez: Computer Science student at Cal State LA turning high-dimensional data into tools people can explore."
    />
    <meta property="og:title" content="Alejandro Lopez" />
    <meta
      property="og:description"
      content="Research, projects, and writing from a CS student at Cal State LA."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />
    <title>Alejandro Lopez</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
